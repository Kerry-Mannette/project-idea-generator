<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Project idea generator" />
    <title>Project Idea Generator</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="site-main">
      <div class="eyebrow">✦ Create something useful</div>
      <h1>Project Idea<br /><span>Generator</span></h1>
      <p class="intro">
        Need a place to start? Generate a simple project idea and turn your
        curiosity into something real.
      </p>

      <section class="generator-card" aria-labelledby="idea-heading">
        <div class="card-label">Your next project</div>
        <p id="project-idea">Click the button to discover an idea.</p>
        <button id="generate-button" type="button">
          Generate an idea <span aria-hidden="true">→</span>
        </button>
      </section>
    </main>

    <footer class="site-footer">
      <p><span>Project Idea Generator</span> &mdash; made for curious minds.</p>
    </footer>
    <script src="js/app.js"></script>
  </body>
</html>
